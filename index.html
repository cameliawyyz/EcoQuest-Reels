```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoQuest Reels</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F4F8F0;
      color: #234B36;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #DCE9D1;
      font-size: 20px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    main {
      height: calc(100vh - 60px);
      overflow-y: auto;
      scroll-snap-type: y mandatory;
    }

    .reel {
      min-height: calc(100vh - 60px);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
    }

    video {
      display: block;
      width: 100%;
      max-width: 390px;
      height: calc(100vh - 100px);
      object-fit: cover;
      border-radius: 18px;
      background: #DCE9D1;
    }
  </style>
</head>

<body>

  <header>EcoQuest Reels</header>

  <main>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="./video1.mp4" type="video/mp4">
        Your browser does not support video.
      </video>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="./video2.mp4" type="video/mp4">
        Your browser does not support video.
      </video>
    </section>

    <section class="reel">
      <video controls playsinline preload="metadata">
        <source src="./video3.mp4" type="video/mp4">
        Your browser does not support video.
      </video>
    </section>

  </main>

</body>
</html>
